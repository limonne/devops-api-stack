
services:

  backend:
    build: .
    container_name: backend-db
    restart: always
    
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx
    container_name: nginx-db
    restart: always

    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - backend

  db:
    image: postgres:17
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}

    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q -$${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 10s
      retries: 5


volumes:
  postgres-data:
