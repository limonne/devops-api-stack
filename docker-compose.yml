
services:

  backend:
    build: .
    container_name: backend-db
    restart: always
    
    env_file: ".env"

    depends_on:
        db:
          condition: service_healthy

  nginx:
    image: nginx
    container_name: nginx-db
    restart: always

    env_file: ".env"
    
    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - backend

  db:
    image: postgres:17
    container_name: postgres-db
    restart: always

    env_file: ".env"

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}

    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q -U devops -d devops" ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres-data:
