services:

  backend:
    build: .
    container_name: backend-db
    restart: always

    depends_on:
        db:
          condition: service_healthy

  nginx:
    image: nginx
    container_name: nginx-db
    restart: always

    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - backend

  db:
    image: postgres:17
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_DB: devops
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: secret

    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q -U devops -d devops" ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres-data:
