apiVersion: v1
kind: Secret

metadata:
  name: {{ .Release.Name }}-secret

  labels:
    app.kubernetes.io/name: devops-web
    app.kubernetes.io/instance: {{ .Release.Name }}

type: Opaque

stringData:
  LAB_USERNAME: {{ .Values.secret.username | quote }}
  LAB_PASSWORD: {{ .Values.secret.password | quote }}
