apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: package-audit

labels:
  - pairs:
      environment: audit
      delivery-method: helm-rendered-kustomize
    includeSelectors: true

patches:
  - target:
      kind: Deployment
      name: audit-web

    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
