apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: nginx-stateful

spec:

  serviceName: nginx-headless

  replicas: 3

  selector:
    matchLabels:
      app: nginx-stateful

  template:

    metadata:
      labels:
        app: nginx-stateful

    spec:

      containers:

      - name: nginx

        image: nginx

        ports:
        - containerPort: 80
