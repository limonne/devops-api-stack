apiVersion: v1
kind: Pod

metadata:
  name: nginx-required

spec:

  affinity:

    nodeAffinity:

      requiredDuringSchedulingIgnoredDuringExecution:

        nodeSelectorTerms:

        - matchExpressions:

          - key: disk

            operator: In

            values:

                - ssd
          - key: environment
            
            operator: In

            values:
                - prod

  containers:

  - name: nginx

    image: nginx
