apiVersion: v1
kind: Pod

metadata:
  name: nginx-preferred

spec:

  affinity:

    nodeAffinity:

      preferredDuringSchedulingIgnoredDuringExecution:

      - weight: 100

        preference:

          matchExpressions:

          - key: environment

            operator: In

            values:

            - production

  containers:

  - name: nginx

    image: nginx
