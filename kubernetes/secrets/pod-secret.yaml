apiVersion: v1
kind: Pod

metadata:
  name: nginx-secret

spec:
  containers:

  - name: nginx

    image: nginx

    env:

    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: DB_USER

    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: DB_PASSWORD
