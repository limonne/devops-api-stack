apiVersion: v1
kind: Pod

metadata:
  name: nginx-liveness

spec:

  containers:

  - name: nginx

    image: nginx

    ports:

    - containerPort: 80

    livenessProbe:

      httpGet:

        path: /

        port: 80

      initialDelaySeconds: 5

      periodSeconds: 5

      timeoutSeconds: 2

      failureThreshold: 1
