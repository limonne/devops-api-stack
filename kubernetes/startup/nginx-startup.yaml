apiVersion: v1
kind: Pod

metadata:
  name: nginx-startup

spec:
  containers:
  - name: nginx
    image: nginx

    ports:
    - containerPort: 80

    startupProbe:
      httpGet:
        path: /
        port: 80
      periodSeconds: 5
      failureThreshold: 12

    readinessProbe:
      httpGet:
        path: /
        port: 80
      periodSeconds: 10

    livenessProbe:
      httpGet:
        path: /
        port: 80
      periodSeconds: 10
