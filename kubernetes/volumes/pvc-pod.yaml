apiVersion: v1

kind: Pod

metadata:
  name: pvc-test

spec:

  containers:

  - name: busybox

    image: busybox

    command:
      - sleep
      - "3600"

    volumeMounts:

    - name: storage

      mountPath: /dados

  volumes:

  - name: storage

    persistentVolumeClaim:

      claimName: pvc-local
