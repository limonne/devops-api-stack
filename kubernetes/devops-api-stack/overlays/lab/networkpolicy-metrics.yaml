---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-backend-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devops-api
      app.kubernetes.io/instance: devops-api
      app.kubernetes.io/component: backend

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-lab
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9091
