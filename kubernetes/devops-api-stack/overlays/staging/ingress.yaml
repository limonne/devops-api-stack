---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ingressClassName: nginx
  rules:
    - host: devops-api.staging.lab
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
