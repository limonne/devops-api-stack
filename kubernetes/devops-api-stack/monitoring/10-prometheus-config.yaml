---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 5s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/node-rules.yml
      - /etc/prometheus/lab-alerts.yml
      - /etc/prometheus/sre-rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring-lab.svc.cluster.local:9093

    scrape_configs:
      - job_name: devops-api
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - devops-api

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            regex: backend
            action: keep

          - source_labels:
              - __meta_kubernetes_pod_container_port_name
            regex: metrics
            action: keep

          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: prometheus
        metrics_path: /metrics
        static_configs:
          - targets:
              - localhost:9090
            labels:
              environment: lab
      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.monitoring-lab.svc.cluster.local:8080
      - job_name: node-exporter
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - monitoring-lab
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep

          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  node-rules.yml: |
    groups:
      - name: node-cpu
        rules:
          - record: node:cpu_usage:ratio_rate5m
            expr: |
              1 - avg by (node) (
                rate(
                  node_cpu_seconds_total{
                    job="node-exporter",
                    mode="idle"
                  }[5m]
                )
              )
      - name: node-mem
        rules:
          - record: node:mem_usage_percentage:ratio
            expr: |
              (1 - avg by (node) (
                node_memory_MemAvailable_bytes{job="node-exporter"}
                /
                node_memory_MemTotal_bytes{job="node-exporter"}
              ))*100
  lab-alerts.yml: |
    groups:
      - name: monitoring-lab-alerts
        interval: 15s
        rules:
          - alert: KubeStateMetricsDown
            expr: up{job="kube-state-metrics"} == 0
            for: 1m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "Kube-state-metrics indisponivel"
              description: >-
                Prometheus can't retrieve metrics to
                {{ $labels.instance }} for about 1 minute.
  sre-rules.yml: |
    groups:
      - name: api-sre-lab
        interval: 15s
        rules:
          - record: api:visits_success:ratio30m
            expr: |
              sum(increase(
                devops_api_http_requests_total{
                  job="devops-api", namespace="devops-api",
                  endpoint="/visits", status=~"2.."
                }[30m]
              ))
              /
              sum(increase(
                devops_api_http_requests_total{
                  job="devops-api", namespace="devops-api",
                  endpoint="/visits"
                }[30m]
              ))

          - record: api:visits_errors:ratio5m
            expr: |
              clamp_min(
                1 -
                sum(rate(
                  devops_api_http_requests_total{
                    job="devops-api", namespace="devops-api",
                    endpoint="/visits", status=~"2.."
                  }[5m]
                ))
                /
                sum(rate(
                  devops_api_http_requests_total{
                    job="devops-api", namespace="devops-api",
                    endpoint="/visits"
                  }[5m]
                )),
                0
              )

          - record: api:visits_burn_rate:ratio5m
            expr: api:visits_errors:ratio5m / 0.01

          - alert: ApiVisitsHighBurn
            expr: api:visits_burn_rate:ratio5m > 5
            for: 1m
            labels:
              severity: critical
              job: devops-api
              environment: lab
            annotations:
              summary: "Consumo elevado do error budget de /visits"
              description: >-
                Burn rate de {{ $value }}x na janela de 5 minutos.
