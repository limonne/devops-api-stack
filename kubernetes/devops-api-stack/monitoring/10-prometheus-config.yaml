---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 5s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/node-rules.yml

    scrape_configs:
      - job_name: devops-api
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - devops-api

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            regex: backend
            action: keep

          - source_labels:
              - __meta_kubernetes_pod_container_port_name
            regex: metrics
            action: keep

          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: prometheus
        metrics_path: /metrics
        static_configs:
          - targets:
              - localhost:9090
            labels:
              environment: lab
      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.monitoring-lab.svc.cluster.local:8080
      - job_name: node-exporter
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - monitoring-lab
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep

          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  node-rules.yml: |
    groups:
      - name: node-cpu
        rules:
          - record: node:cpu_usage:ratio_rate5m
            expr: |
              1 - avg by (node) (
                rate(
                  node_cpu_seconds_total{
                    job="node-exporter",
                    mode="idle"
                  }[5m]
                )
              )
      - name: node-mem
        rules:
          - record: node:mem_usage_percentage:ratio
            expr: |
              (1 - avg by (node) (
                node_memory_MemAvailable_bytes{job="node-exporter"}
                /
                node_memory_MemTotal_bytes{job="node-exporter"}
              ))*100
