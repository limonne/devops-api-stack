---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: monitoring-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-webhook
  template:
    metadata:
      labels:
        app: alert-webhook
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

      containers:
        - name: receiver
          image: python:3.12-slim
          command: ["python", "-u", "-c"]
          args:
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_POST(self):
                      length = int(
                          self.headers.get("Content-Length", "0")
                      )
                      payload = json.loads(self.rfile.read(length))
                      message = {
                          "path": self.path,
                          "receiver": payload["receiver"],
                          "status": payload["status"],
                          "alerts": len(payload["alerts"]),
                          "groupLabels": payload["groupLabels"],
                      }
                      print(json.dumps(message), flush=True)
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"OK")

                  def log_message(self, *args):
                      pass

              HTTPServer(
                  ("0.0.0.0", 8080), Handler
              ).serve_forever()

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: monitoring-lab
spec:
  selector:
    app: alert-webhook
  ports:
    - name: http
      port: 8080
      targetPort: http
