---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring-lab
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      receiver: lab-default
      group_by: [alertname, job]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1m

      routes:
        - matchers:
            - 'severity="critical"'
          receiver: lab-critical

    receivers:
      - name: lab-default
        webhook_configs:
          - url: http://alert-webhook:8080/default
            send_resolved: true

      - name: lab-critical
        webhook_configs:
          - url: http://alert-webhook:8080/critical
            send_resolved: true
