---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring-lab
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: prometheus
        orgId: 1
        uid: bg2hujwhf4glcb
        type: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring-lab
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: devops-api-stack
        orgId: 1
        folder: DevOps API Stack
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
