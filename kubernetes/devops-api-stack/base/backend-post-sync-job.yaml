---
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-release-check
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 90
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-release-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api-check
          image: ghcr.io/limonne/devops-api-stack:3.0.0

          envFrom:
            - configMapRef:
                name: backend-release-check-config

          command: ["python", "-c"]
          args:
            - |
              import json
              import os
              from urllib.request import Request, urlopen

              base_url = os.environ["INGRESS_URL"].rstrip("/")
              host = os.environ["API_HOST"]

              checks = {
                  "live": ("status", "alive"),
                  "ready": ("database", "OK"),
                  "version": (
                      "version",
                      os.environ["EXPECTED_VERSION"],
                  ),
              }

              for endpoint, (key, expected) in checks.items():
                  request = Request(
                      f"{base_url}/api/{endpoint}",
                      headers={"Host": host},
                  )

                  with urlopen(request, timeout=5) as response:
                      body = json.load(response)

                  print(f"/api/{endpoint}: {body}")

                  if body.get(key) != expected:
                      raise SystemExit(
                          f"FAILED: unexpected {endpoint} response"
                      )

              print("PostSync API check OK")

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
