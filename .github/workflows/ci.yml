---
name: CI

on:
  push:
  pull_request:

# Concurrency based on PR number ou reference for fallback
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
	runs-on: ubuntu-latest
	strategy:
      matrix:
        linter: [python, yaml]

	steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python composite
        uses: ./.github/actions/setup-python/action.yml

      - name: Lint python
        if: matrix.linter == 'python'
        run: flake8 server.py

      - name: Lint yaml
        if: matrix.linter == 'yaml'
        run: yamllint docker-compose.yml

  validate:
    needs: lint
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project files
        run: ls -la

      - name: Check docker compose config
        run: docker compose config

      - name: Check python syntax
        run: python -m py_compile server.py

      - name: System Info
        run: |
          uname -a
          df -h
          free -h
          nproc

  build:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker build
        run: docker build -t devops-api-backend .

  healthcheck:
    needs: build
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker build
        run: docker build -t devops-api-backend .

      - name: Start containers
        run: docker compose up -d

      - name: Wait for services become healthy
        run: |
            for i in {1..12}; do
              if curl -fsS http://localhost:8080/api/health; then
                exit 0
              fi
              docker compose ps
              sleep 5
              done
              docker compose logs
              exit 1

      - name: Check backend responds
        run: curl localhost:8080/api/visits

      - name: Check DB Health
        run: curl localhost:8080/api/health

      - name: Create artifacts folder
        if: always()
        run: mkdir -p artifacts

      - name: Save container status
        if: always()
        run: docker ps > artifacts/containers.txt

      - name: Save compose logs
        if: always()
        run: docker compose logs > artifacts/compose.log

      - name: Save health response
        if: always()
        run: curl -s localhost:8080/api/health > artifacts/health.json || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-artifacts
          path: artifacts/

      - name: Cleanup all
        if: always()
        run: docker compose down -v
