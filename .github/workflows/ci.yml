---
name: CI

on:
  push:
  pull_request:

# Concurrency based on PR number ou reference for fallback
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image-changes:
    name: Detect image changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check image files
        id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            publish=true
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
            Dockerfile \
            .dockerignore \
            server.py \
            requirements.txt \
            .github/workflows/publish-image.yml; then
            publish=false
          else
            publish=true
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  call-lint:
    uses: ./.github/workflows/lint.yml
    with: 
      python-version: "3.12"

  validate:
    needs: call-lint
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project files
        run: ls -la

      - name: Check docker compose config
        run: docker compose config

      - name: Check python syntax
        run: python -m py_compile server.py

      - name: Check Kubernetes secret hygiene
        run: |
          if git ls-files --error-unmatch \
            kubernetes/devops-api-stack/overlays/lab/secrets.env \
            >/dev/null 2>&1; then
            echo "ERROR: secrets.env must not be tracked"
            exit 1
          fi

      - name: Render Kubernetes manifests
        run: |
          secret_file=kubernetes/devops-api-stack/overlays/lab/secrets.env

          cp \
            kubernetes/devops-api-stack/overlays/lab/secrets.env.example \
            "$secret_file"

          trap 'rm -f "$secret_file"' EXIT

          kubectl version --client

          kubectl kustomize \
            kubernetes/devops-api-stack/base \
            > /tmp/devops-api-base.yaml

          kubectl kustomize \
            kubernetes/devops-api-stack/overlays/lab \
            > /tmp/devops-api-lab.yaml

          test -s /tmp/devops-api-base.yaml
          test -s /tmp/devops-api-lab.yaml

      - name: System Info
        run: |
          uname -a
          df -h
          free -h
          nproc

  build:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker build
        run: docker build -t devops-api-backend .

  healthcheck:
    needs: build
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker build
        run: docker build -t devops-api-backend .

      - name: Start containers
        run: docker compose up -d

      - name: Wait for services become healthy
        run: |
            for i in {1..12}; do
              if curl -fsS http://localhost:8080/api/health; then
                exit 0
              fi
              docker compose ps
              sleep 5
              done
              docker compose logs
              exit 1

      - name: Health Checks
        uses: ./.github/actions/healthchecks

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-artifacts
          path: artifacts/

      - name: Cleanup all
        if: always()
        run: docker compose down -v

  publish:
    name: Publish validated image
    needs:
      - healthcheck
      - image-changes
    if: |
      github.event_name == 'push' &&
      needs.image-changes.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
