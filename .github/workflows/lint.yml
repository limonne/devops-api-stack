name: Lint workflow
  
on: 
  workflow_call:
    inputs:
      python-version:
        description: 'Python version'
        required: true
        type: string

jobs:
  ReusableMatrixforLint:
    strategy:
      matrix:
        linter: [python, yaml]
    runs-on: ${{ inputs.python-version }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python composite
        uses: ./.github/actions/setup-python

      - name: Lint python
        if: matrix.linter == 'python'
        run: flake8 server.py

      - name: Lint yaml
        if: matrix.linter == 'yaml'
        run: yamllint docker-compose.yml
